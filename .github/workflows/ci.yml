name: Railway Reservation System CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mingw:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build application and tests
        run: cmake --build build --parallel

      - name: Run automated tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build application and tests
        run: cmake --build build --parallel

      - name: Run automated tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  coverage:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install gcovr
        run: pipx install gcovr==8.3

      - name: Configure CMake with coverage instrumentation
        run: >
          cmake -S . -B build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0"

      - name: Build application and tests
        run: cmake --build build-cov --parallel

      - name: Run automated tests
        run: ctest --test-dir build-cov --output-on-failure --no-tests=error

      - name: Line and branch coverage report
        run: |
          args=(--root . --exclude-directories 'build-cov/_deps'
                --filter 'src/' --exclude 'src/main\.cpp'
                --exclude-throw-branches --exclude-unreachable-branches)
          mkdir -p coverage
          gcovr "${args[@]}" --txt coverage/lines.txt --html-details coverage/index.html \
                --cobertura coverage/coverage.xml --print-summary | tee coverage/summary.txt
          gcovr "${args[@]}" --txt-metric branch --txt coverage/branches.txt
          {
            echo '## Coverage'
            echo '```'
            cat coverage/summary.txt
            echo
            cat coverage/lines.txt
            cat coverage/branches.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  static-analysis:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: cppcheck (warnings, performance and portability fail the build)
        run: >
          cppcheck --enable=warning,performance,portability
          --std=c++17 --language=c++ --inline-suppr
          --suppress=missingIncludeSystem --error-exitcode=1
          -I src src

      - name: cppcheck style report (advisory)
        run: |
          cppcheck --enable=style --std=c++17 --language=c++ --inline-suppr \
                   --suppress=missingIncludeSystem -q -I src src 2> cppcheck-style.txt || true
          {
            echo '## cppcheck style findings (advisory)'
            echo '```'
            cat cppcheck-style.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    runs-on: ubuntu-24.04

    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build application and tests
        run: cmake --build build-san --parallel

      - name: Run automated tests under the sanitizers
        run: ctest --test-dir build-san --output-on-failure --no-tests=error

  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build image (compiles and runs the test suite inside)
        run: docker build -t rrs:${{ github.sha }} .

      - name: Smoke-run the image (start, then choose Exit)
        run: echo 3 | docker run --rm -i rrs:${{ github.sha }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build-and-test, coverage, static-analysis, sanitizers, docker ]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build release binary
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build --parallel --target railway_reservation

      - name: Build and export Docker image
        run: |
          docker build -t rrs:${{ github.sha }} .
          docker save rrs:${{ github.sha }} | gzip > rrs-image.tar.gz

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: railway_reservation-linux-x86_64-${{ github.sha }}
          path: build/railway_reservation
          retention-days: 90

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: rrs-docker-image-${{ github.sha }}
          path: rrs-image.tar.gz
          retention-days: 90
